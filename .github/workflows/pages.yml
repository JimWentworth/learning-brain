# Optional: publish site/ to GitHub Pages instead of (or as well as) Vercel.
# To use it: Settings -> Pages -> Source: "GitHub Actions" (needs a public repository on a free plan),
# then Actions -> "Publish to GitHub Pages" -> Run workflow. To publish on every push, add `push: {branches: [main]}` under `on:`.
name: Publish to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
